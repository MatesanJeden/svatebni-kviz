<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderátor | Nat & Anička</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }

        .dragging-item {
            opacity: 0.35;
            transform: scale(0.99);
            background-color: #f5f5f4 !important;
        }

        /* Spotify vodicí linka v mezeře mezi kartami */
        .drop-gap-zone {
            position: relative;
            height: 12px;
            margin: -6px 0;
            z-index: 10;
            transition: height 0.15s ease;
        }

        .drop-gap-zone.active-drop {
            height: 20px;
            margin: -2px 0;
        }

        .drop-gap-zone.active-drop::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 12px;
            right: 12px;
            height: 2px;
            background: #FB7185;
            border-radius: 9999px;
            transform: translateY(-50%);
        }

        /* Dekorační tečka na začátku linky (Spotify Queue detail) */
        .drop-gap-zone.active-drop::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 6px;
            width: 6px;
            height: 6px;
            background: #FB7185;
            border-radius: 50%;
            transform: translateY(-50%);
        }
    </style>
</head>
<body class="bg-[#faf8f5] text-stone-800 min-h-screen flex flex-col selection:bg-rose-100">

<header class="bg-white/90 backdrop-blur border-b border-stone-200/80 sticky top-0 z-30 px-6 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="text-amber-600 font-bold">⚙</span>
            <span class="font-serif italic font-bold text-stone-800 text-lg">Moderátorský panel – Nat & Anička</span>
        </div>
    </div>
</header>

<main class="flex-1 flex justify-center p-4 sm:p-6">
    <div class="w-full max-w-5xl space-y-6">

        <!-- Odemčení PINem (zobrazí se pouze, pokud PIN není uložen) -->
        <div id="adminLock" class="max-w-xs mx-auto bg-white p-6 rounded-2xl border border-stone-200 shadow-sm text-center space-y-3 mt-10">
            <h3 class="font-serif text-lg">Zadejte PIN moderátora</h3>
            <input id="adminPinInput" type="password" onkeydown="if(event.key === 'Enter') unlockAdmin()" placeholder="PIN (výchozí 1234)" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-center text-sm focus:outline-none">
            <button onclick="unlockAdmin()" class="w-full py-2 bg-stone-800 text-stone-50 rounded-xl text-xs font-semibold hover:bg-stone-900 transition">Odemknout panel</button>
        </div>

        <!-- Moderátorská nástěnka -->
        <div id="adminDashboard" class="hidden space-y-6">
            <div class="bg-white border border-stone-200 rounded-2xl p-5 shadow-sm flex flex-wrap items-center justify-between gap-3">
                <div>
                    <span class="text-[10px] uppercase font-bold text-stone-400">Průběh kvízu</span>
                    <h2 class="font-serif text-xl">Stav: <span id="adminStateBadge" class="text-amber-800 font-bold">LOBBY</span></h2>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button onclick="showQr()" class="px-3 py-2 bg-stone-100 hover:bg-stone-200 border border-stone-200 rounded-xl text-xs font-medium transition">📷 QR Kód pro stoly</button>
                    <button id="btnAdminStart" onclick="setAdminState('QUESTIONNAIRE')" class="px-4 py-2 bg-stone-800 hover:bg-stone-900 text-stone-50 rounded-xl text-xs font-semibold transition">Spustit otázky</button>

                    <!-- Dynamické tlačítko: Uzavřít hlasování -> Vyhlásit vítěze -->
                    <button id="btnAdminAction" class="hidden px-4 py-2 rounded-xl text-xs font-semibold transition"></button>

                    <button onclick="resetGame()" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded-xl text-xs font-medium transition">Reset hry</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2 bg-white border border-stone-200 rounded-2xl p-5 shadow-sm space-y-4">

                    <div id="adminCorrectAnswersBox">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="font-serif text-lg">Otázky a správné odpovědi</h3>
                                <p class="text-xs text-stone-400" id="adminHelpText"></p>
                            </div>
                            <div id="answersProgressBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-stone-100 text-stone-600">
                                Vyplněno: 0 / 0
                            </div>
                        </div>

                        <!-- Přidání nové otázky (v LOBBY) -->
                        <div id="addQuestionForm" class="p-3 mb-4 bg-stone-50 border border-dashed border-stone-300 rounded-xl flex gap-2">
                            <input id="newQuestionInput" type="text" onkeydown="if(event.key === 'Enter') { event.preventDefault(); addQuestion(); }" placeholder="Znění nové otázky (např. Kdo je větší spáč?)" class="flex-1 px-3 py-1.5 text-xs bg-white border border-stone-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-amber-500">
                            <button onclick="addQuestion()" class="px-3 py-1.5 bg-stone-800 hover:bg-stone-900 text-stone-50 rounded-lg text-xs font-semibold whitespace-nowrap transition">+ Přidat otázku</button>
                        </div>

                        <!-- Seznam otázek s mezerovými drop zónami -->
                        <div id="adminQuestionsList" class="space-y-0"></div>
                    </div>

                    <div id="adminResultsBox" class="hidden">
                        <h3 class="font-serif text-lg mb-3">Konečné pořadí svatebčanů</h3>
                        <div id="adminLeaderboardList" class="divide-y divide-stone-100"></div>
                    </div>
                </div>

                <div class="bg-white border border-stone-200 rounded-2xl p-5 shadow-sm">
                    <h3 class="font-serif text-base border-b border-stone-100 pb-2 mb-3">Připojení hosté (<span id="adminPlayersCount">0</span>)</h3>
                    <div id="adminPlayersList" class="space-y-1.5 max-h-96 overflow-y-auto"></div>
                </div>
            </div>
        </div>

    </div>
</main>

<!-- QR Modal -->
<div id="qrModal" class="hidden fixed inset-0 bg-stone-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center space-y-4 shadow-xl border border-stone-200">
        <h3 class="font-serif text-lg text-stone-800">QR kód pro svatebčany</h3>
        <div id="qrcode" class="p-3 bg-white border border-stone-200 rounded-2xl flex justify-center shadow-inner"></div>
        <p class="text-[11px] text-stone-500">Odkazuje přímo na hlavní stránku kvízu pro hosty.</p>
        <button onclick="document.getElementById('qrModal').classList.add('hidden')" class="w-full py-2 bg-stone-100 hover:bg-stone-200 rounded-xl text-xs font-medium">Zavřít</button>
    </div>
</div>

<script>
    const OPTIONS = [
        { code: 'NAT', label: 'Nat' },
        { code: 'ANICKA', label: 'Anička' },
        { code: 'OBA', label: 'Oba' }
    ];

    // Načtení zapamatovaného PINu z localStorage
    let adminPin = localStorage.getItem('wedding_admin_pin') || '';
    let gameState = { state: 'LOBBY', questions: [], correctAnswers: [], players: [] };
    let draggedIndex = null;

    // Automatické odemčení, pokud byl PIN zadán dříve
    if (adminPin === "1234") {
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('adminLock').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
        });
    }

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}/ws`);

    ws.onmessage = (event) => {
        gameState = JSON.parse(event.data);
        renderAdminUI();
    };

    function sendWs(data) {
        ws.send(JSON.stringify(data));
    }

    function unlockAdmin() {
        const pin = document.getElementById('adminPinInput').value;
        if (pin === "1234") {
            adminPin = pin;
            localStorage.setItem('wedding_admin_pin', pin);
            document.getElementById('adminLock').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            renderAdminUI();
        } else {
            alert("Špatný PIN!");
        }
    }

    function setAdminState(newState) {
        sendWs({ type: 'ADMIN_CHANGE_STATE', state: newState, pin: adminPin });
    }

    function setAdminCorrect(qIdx, optCode) {
        sendWs({ type: 'ADMIN_SET_ANSWER', qIdx: qIdx, option: optCode, pin: adminPin });
    }

    function resetGame() {
        if (confirm("Opravdu restartovat celou hru pro všechny svatebčany?")) {
            sendWs({ type: 'ADMIN_RESET', pin: adminPin });
        }
    }

    function addQuestion() {
        const input = document.getElementById('newQuestionInput');
        const text = input.value.trim();
        if (!text) return;
        sendWs({ type: 'ADMIN_ADD_QUESTION', text: text, pin: adminPin });
        input.value = '';
    }

    function removeQuestion(index) {
        if (confirm("Opravdu smazat tuto otázku?")) {
            sendWs({ type: 'ADMIN_REMOVE_QUESTION', index: index, pin: adminPin });
        }
    }

    // --- SPOTIFY-LIKE DRAG & DROP MEZI OTÁZKAMI ---
    function onDragStart(e, index) {
        if (gameState.state !== 'LOBBY') return;
        draggedIndex = index;
        e.dataTransfer.effectAllowed = 'move';
        e.currentTarget.classList.add('dragging-item');
    }

    function onGapDragOver(e, slotIndex) {
        if (gameState.state !== 'LOBBY' || draggedIndex === null) return;

        if (slotIndex === draggedIndex || slotIndex === draggedIndex + 1) {
            return;
        }

        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';

        clearGapHighlights();
        e.currentTarget.classList.add('active-drop');
    }

    function onGapDragLeave(e) {
        e.currentTarget.classList.remove('active-drop');
    }

    function onGapDrop(e, slotIndex) {
        e.preventDefault();
        clearGapHighlights();

        if (draggedIndex === null) return;

        if (slotIndex === draggedIndex || slotIndex === draggedIndex + 1) {
            draggedIndex = null;
            return;
        }

        let targetIndex = slotIndex;
        if (draggedIndex < slotIndex) {
            targetIndex = slotIndex - 1;
        }

        sendWs({
            type: 'ADMIN_MOVE_QUESTION',
            from: draggedIndex,
            to: targetIndex,
            pin: adminPin
        });

        draggedIndex = null;
    }

    function onDragEnd() {
        clearGapHighlights();
        document.querySelectorAll('.dragging-item').forEach(el => el.classList.remove('dragging-item'));
        draggedIndex = null;
    }

    function clearGapHighlights() {
        document.querySelectorAll('.drop-gap-zone').forEach(el => el.classList.remove('active-drop'));
    }

    function renderAdminUI() {
        if (!adminPin) return;

        const totalQ = gameState.questions.length;
        const filledCount = gameState.correctAnswers.filter(a => a !== null && a !== undefined).length;
        const allFilled = totalQ > 0 && filledCount === totalQ;

        document.getElementById('adminStateBadge').innerText = gameState.state;
        document.getElementById('btnAdminStart').classList.toggle('hidden', gameState.state !== 'LOBBY');

        // Dynamická změna tlačítka: "Uzavřít hlasování" -> "Vyhlásit vítěze"
        const btnAction = document.getElementById('btnAdminAction');
        if (gameState.state === 'QUESTIONNAIRE') {
            btnAction.classList.remove('hidden');
            btnAction.disabled = false;
            btnAction.className = "px-4 py-2 bg-amber-700 hover:bg-amber-800 text-white rounded-xl text-xs font-semibold transition cursor-pointer shadow-sm";
            btnAction.innerText = "Uzavřít hlasování";
            btnAction.onclick = () => setAdminState('EVALUATION');
        } else if (gameState.state === 'EVALUATION') {
            btnAction.classList.remove('hidden');
            if (allFilled) {
                btnAction.disabled = false;
                btnAction.className = "px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-xs font-semibold transition cursor-pointer shadow-sm";
                btnAction.innerText = "Vyhlásit vítěze ✓";
                btnAction.onclick = () => setAdminState('RESULTS');
            } else {
                btnAction.disabled = true;
                btnAction.className = "px-4 py-2 bg-stone-200 text-stone-400 rounded-xl text-xs font-semibold cursor-not-allowed";
                btnAction.innerText = `Vyhlásit vítěze (${filledCount}/${totalQ})`;
                btnAction.onclick = null;
            }
        } else {
            btnAction.classList.add('hidden');
            btnAction.onclick = null;
        }

        // Počítadlo odpovědí
        const badge = document.getElementById('answersProgressBadge');
        badge.innerText = `Vyplněno: ${filledCount} / ${totalQ}`;
        badge.className = allFilled
            ? "text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200"
            : "text-xs font-semibold px-2.5 py-1 rounded-full bg-stone-100 text-stone-600 border border-stone-200";

        document.getElementById('adminCorrectAnswersBox').classList.toggle('hidden', gameState.state === 'RESULTS');
        document.getElementById('adminResultsBox').classList.toggle('hidden', gameState.state !== 'RESULTS');

        const isLobby = gameState.state === 'LOBBY';
        document.getElementById('addQuestionForm').classList.toggle('hidden', !isLobby);
        document.getElementById('adminHelpText').innerText = isLobby
            ? "Otázky můžete upravovat nebo přetahovat v mezerách."
            : (allFilled ? "Všechny odpovědi jsou zadány. Můžete vyhlásit vítěze." : "Klikněte na možnost podle toho, co novomanželé zvedli (nutno vyplnit vše):");

        // Render otázek střídaných s drop zónami v mezerách
        let qHtml = '';

        gameState.questions.forEach((q, qIdx) => {
            const currentAns = gameState.correctAnswers[qIdx];

            if (isLobby) {
                qHtml += `
            <div
              class="drop-gap-zone"
              ondragover="onGapDragOver(event, ${qIdx})"
              ondragleave="onGapDragLeave(event)"
              ondrop="onGapDrop(event, ${qIdx})"
            ></div>`;
            }

            qHtml += `
          <div
            ${isLobby ? `
              draggable="true"
              ondragstart="onDragStart(event, ${qIdx})"
              ondragend="onDragEnd()"
            ` : ''}
            class="p-3 bg-white border border-stone-200/90 rounded-xl space-y-2 transition-all ${
                isLobby ? 'cursor-grab active:cursor-grabbing hover:border-stone-300 shadow-sm' : ''
            }"
          >
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-2.5 flex-1 min-w-0">
                ${isLobby ? `
                  <div class="text-stone-300 hover:text-stone-500 select-none p-1 shrink-0" title="Uchopit a přetáhnout">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 16 16">
                      <path d="M2.5 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm-10-5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
                    </svg>
                  </div>
                ` : ''}

                <span class="text-xs font-bold text-stone-400 font-mono w-4 shrink-0">${qIdx + 1}.</span>
                <span class="text-xs font-semibold text-stone-800 truncate select-none">${q.text}</span>
              </div>

              ${isLobby ? `
                <button onclick="removeQuestion(${qIdx})" class="w-6 h-6 rounded flex items-center justify-center text-xs font-bold text-rose-500 hover:bg-rose-50 border border-rose-200 shrink-0" title="Smazat">✕</button>
              ` : ''}
            </div>

            <!-- Tlačítka pro správnou odpověď -->
            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-stone-100">
              ${OPTIONS.map(opt => `
                <button type="button" onclick="setAdminCorrect(${qIdx}, '${opt.code}')" class="py-1.5 px-2 rounded-lg text-xs font-semibold border text-center transition ${
                currentAns === opt.code
                    ? 'bg-stone-800 text-stone-50 border-stone-800 shadow-sm'
                    : 'bg-stone-50 border-stone-200/80 text-stone-600 hover:bg-stone-100 hover:border-stone-300'
            }">
                  ${opt.label}
                </button>
              `).join('')}
            </div>
          </div>`;
        });

        if (isLobby && totalQ > 0) {
            qHtml += `
          <div
            class="drop-gap-zone"
            ondragover="onGapDragOver(event, ${totalQ})"
            ondragleave="onGapDragLeave(event)"
            ondrop="onGapDrop(event, ${totalQ})"
          ></div>`;
        }

        document.getElementById('adminQuestionsList').innerHTML = qHtml;

        // Žebříček s detekcí všech soubojů v TOP 3 v admin panelu
        const scoreGroups = {};
        gameState.players.forEach(p => {
            const sc = p.score || 0;
            if (!scoreGroups[sc]) scoreGroups[sc] = [];
            scoreGroups[sc].push(p);
        });

        const sortedScores = Object.keys(scoreGroups).map(Number).sort((a, b) => b - a);

        const battles = []; // Seznam nutných rozstřelů
        let currentRank = 1;

        for (const score of sortedScores) {
            const group = scoreGroups[score];
            const count = group.length;

            if (currentRank > 3) break;

            if (count > 1) {
                let battleTitle = '';
                if (currentRank === 1) {
                    battleTitle = count === 2 ? 'Souboj o 1. a 2. místo (zlato / stříbro)' : 'Souboj o kompletní stupně vítězů';
                } else if (currentRank === 2) {
                    battleTitle = 'Souboj o 2. a 3. místo (stříbro / bronz)';
                } else if (currentRank === 3) {
                    battleTitle = 'Souboj o 3. místo (bronz)';
                }

                battles.push({
                    title: battleTitle,
                    rank: currentRank,
                    score: score,
                    names: group.map(p => p.name).join(', '),
                    playerIds: new Set(group.map(p => p.id))
                });
            }
            currentRank += count;
        }

        let tieBreakAlert = '';
        if (battles.length > 0) {
            tieBreakAlert = battles.map(b => `
                <div class="mb-3 p-3.5 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-800 flex items-start gap-2.5">
                    <span class="text-xl shrink-0">⚔️</span>
                    <div>
                        <strong class="font-bold text-rose-900 block text-sm">${b.title}</strong>
                        <p class="mt-0.5">Shoda na ${b.score} bodech. Vyhlaste souboj mezi:</p>
                        <p class="font-bold text-stone-800 mt-1 bg-white px-2 py-1 rounded border border-rose-200 inline-block">${b.names}</p>
                    </div>
                </div>
            `).join('');
        } else if (gameState.players.length > 0) {
            tieBreakAlert = `
                <div class="mb-4 p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-800 flex items-center gap-2">
                    <span class="text-base">🏆</span>
                    <div><strong>Všechna 3 pódiová místa jsou jednoznačná!</strong> Není potřeba žádný rozstřel.</div>
                </div>
            `;
        }

        let lbHtml = tieBreakAlert;
        const sorted = [...gameState.players].sort((a,b) => (a.rank || 99) - (b.rank || 99));
        sorted.forEach(p => {
            const isPodium = p.rank <= 3;
            const medal = p.rank === 1 ? '🥇' : (p.rank === 2 ? '🥈' : (p.rank === 3 ? '🥉' : ''));
            const inBattle = battles.some(b => b.playerIds.has(p.id));

            lbHtml += `
          <div class="py-2.5 px-2 flex justify-between items-center text-sm rounded-lg ${inBattle ? 'bg-rose-50/70 border border-rose-200' : (isPodium ? 'bg-amber-50/50' : '')}">
            <span class="flex items-center gap-1.5 font-medium ${isPodium ? 'text-stone-900 font-semibold' : 'text-stone-700'}">
              <span>#${p.rank || '-'}</span>
              <span>${p.name}</span>
              ${medal ? `<span>${medal}</span>` : ''}
              ${inBattle ? `<span class="text-[10px] font-bold text-rose-600 bg-rose-100 px-1.5 py-0.5 rounded ml-1">SOUBOJ</span>` : ''}
            </span>
            <span class="font-bold text-xs bg-stone-100 border border-stone-200 px-2.5 py-1 rounded-lg">${p.score || 0} / ${totalQ} b.</span>
          </div>`;
        });
        document.getElementById('adminLeaderboardList').innerHTML = lbHtml;

        // Připojení hosté
        document.getElementById('adminPlayersCount').innerText = gameState.players.length;
        let pListHtml = '';
        gameState.players.forEach(p => {
            pListHtml += `
          <div class="p-2 bg-stone-50 border border-stone-100 rounded-xl flex justify-between text-xs items-center">
            <span>${p.name}</span>
            <span class="${p.submitted ? 'text-emerald-700 font-semibold' : 'text-stone-400'}">${p.submitted ? 'Odevzdáno' : 'Vyplňuje'}</span>
          </div>`;
        });
        document.getElementById('adminPlayersList').innerHTML = pListHtml;
    }

    function showQr() {
        document.getElementById('qrcode').innerHTML = "";
        const guestUrl = window.location.origin + "/";
        new QRCode(document.getElementById("qrcode"), {
            text: guestUrl,
            width: 170,
            height: 170
        });
        document.getElementById('qrModal').classList.remove('hidden');
    }

    // Žebříček v admin panelu
    const winners = gameState.players.filter(p => p.rank === 1);
    let tieBreakAlert = '';

    if (winners.length > 1) {
        const winnerNames = winners.map(w => w.name).join(', ');
        tieBreakAlert = `
    <div class="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-800 flex items-center gap-2">
      <span class="text-base">⚔️</span>
      <div>
        <strong>Remíza na 1. místě!</strong> Vyhlaste rozstřel mezi hráči: <strong>${winnerNames}</strong>
      </div>
    </div>
  `;
    }

    let lbHtml = tieBreakAlert;
    const sorted = [...gameState.players].sort((a,b) => (a.rank || 99) - (b.rank || 99));
    sorted.forEach(p => {
        const isTop = p.rank === 1;
        lbHtml += `
    <div class="py-2.5 flex justify-between items-center text-sm ${isTop ? 'font-semibold text-stone-900 bg-amber-50/50 px-2 rounded-lg' : ''}">
      <span class="flex items-center gap-1.5">
        <span>#${p.rank || '-'}</span>
        <span>${p.name}</span>
        ${isTop ? '<span class="text-amber-600 text-xs">👑</span>' : ''}
      </span>
      <span class="font-bold text-xs bg-stone-100 border border-stone-200 px-2.5 py-1 rounded-lg">${p.score || 0} / ${totalQ} b.</span>
    </div>`;
    });
    document.getElementById('adminLeaderboardList').innerHTML = lbHtml;
</script>
